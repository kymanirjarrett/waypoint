name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # The job name "build" is the required status check in branch protection. Renaming it breaks merges.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  # Deploys main to Azure App Service. Signs in with OIDC (federated managed identity), so no secrets are stored.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.AZURE_WEBAPP_URL }}
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish Waypoint/Waypoint.csproj -c Release -o ${{ runner.temp }}/publish

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ runner.temp }}/publish

      # F1 has no Always On, so the first request after a deploy can take a while. Retry for about 90 seconds.
      - name: Smoke test
        env:
          BASE_URL: ${{ vars.AZURE_WEBAPP_URL }}
        run: |
          for path in / /destinations /destinations/kyoto; do
            ok=""
            for attempt in $(seq 1 9); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$BASE_URL$path" || true)
              if [ "$code" = "200" ]; then ok=1; break; fi
              echo "$path returned $code (attempt $attempt), retrying in 10s"
              sleep 10
            done
            if [ -z "$ok" ]; then echo "::error::$path did not return 200"; exit 1; fi
            echo "$path OK"
          done
